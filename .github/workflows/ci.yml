name: Check application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend
        run: |
          cd backend
          npm install
          npm run check
      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
